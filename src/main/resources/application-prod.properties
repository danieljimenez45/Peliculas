#spring.profiles.active=prod

# ========================================
# PERFIL DE PRODUCCIÓN
# ========================================
# Este perfil está optimizado para producción
# - Base de datos postgres en docker (persiste los datos)
# - NO se cargan datos de prueba
# - Optimizado para Docker
# ========================================


# Base de datos PostgreSQL
# DB_HOST=localhost cuando ejecutas la app en tu máquina (Postgres en Docker)
# DB_HOST=db cuando la app corre dentro de Docker (misma red que el contenedor postgres)
# DB_PORT=5433 si el contenedor expone 5433 (porque 5432 está ocupado en el host)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:miapp}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:pass}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Security
server.error.include-message=never
server.error.include-binding-errors=never

# Logging optimizado para producción
logging.level.root=WARN
logging.level.es.danieljr.walaspringboot=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Pebble con caché en producción para mejor rendimiento
pebble.cache=true

# H2 console deshabilitada por seguridad
spring.h2.console.enabled=false

# JPA no mostrar SQL por rendimiento
spring.jpa.show-sql=false

# DevTools deshabilitado en producción
spring.devtools.restart.enabled=false

# Cache habilitada para mejor rendimiento
spring.cache.type=simple
